name: build

on:
  push:
    branches:
      - master
    tags:
      - "*-[0-9]+.*"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'
      - name: Set up CI environment
        run: .github/setup.sh
        shell: bash
      - name: Execute the build
        run: .github/build.sh
        shell: bash
        env:
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          SIGNING_ASC: ${{ secrets.SIGNING_ASC }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, 'SNAPSHOT'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Get version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      - name: Check if release version
        id: check
        run: |
          if [[ "${{ steps.version.outputs.version }}" != *"-SNAPSHOT" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "This is a release version: ${{ steps.version.outputs.version }}"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "This is a SNAPSHOT version: ${{ steps.version.outputs.version }}"
          fi

      - name: Build JAR for release
        if: steps.check.outputs.is_release == 'true'
        run: mvn -B package -DskipTests

      - name: Create GitHub Release
        if: steps.check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Release of Config-UI version ${{ steps.version.outputs.version }}

            ## Changes
            See the commit history for details.

            ## Artifacts
            - `config-ui-${{ steps.version.outputs.version }}.jar` - The main library JAR
          files: target/config-ui-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
