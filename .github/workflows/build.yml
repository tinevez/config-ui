name: build

on:
  push:
    branches:
      - master
    tags:
      - "*-[0-9]+.*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release with JAR artifact'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'
      - name: Set up CI environment
        run: .github/setup.sh
        shell: bash
      - name: Execute the build
        run: .github/build.sh
        shell: bash
        env:
          NO_DEPLOY: true
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          SIGNING_ASC: ${{ secrets.SIGNING_ASC }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Get project info from pom.xml
        id: project
        run: |
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project: $ARTIFACT_ID version: $VERSION"

      - name: Check if release version
        id: check
        run: |
          if [[ "${{ steps.project.outputs.version }}" != *"-SNAPSHOT" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "This is a release version: ${{ steps.project.outputs.version }}"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "This is a SNAPSHOT version: ${{ steps.project.outputs.version }}"
          fi

      - name: Build JAR for release
        if: steps.check.outputs.is_release == 'true'
        run: mvn -B package -DskipTests

      - name: Create GitHub Release
        if: steps.check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.project.outputs.artifact_id }}-${{ steps.project.outputs.version }}
          name: ${{ steps.project.outputs.artifact_id }} ${{ steps.project.outputs.version }}
          body: |
            Release of ${{ steps.project.outputs.artifact_id }} version ${{ steps.project.outputs.version }}

            ## Artifacts
            - `${{ steps.project.outputs.artifact_id }}-${{ steps.project.outputs.version }}.jar` - The main library JAR
          files: target/${{ steps.project.outputs.artifact_id }}-${{ steps.project.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
